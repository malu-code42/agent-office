  <body>
    <nav class="pv-head">
      <b>Banco automático · modelos</b>
      <a href="#a">A · Iniciar</a>
      <a href="#b">B · Progresso</a>
      <a href="#c">C · Relatório</a>

    <main class="pv-grid">
      <!-- A -->
      <figure class="pv-fig pv-w-sm" id="a">
        <figcaption>A · Iniciar geração<span>aberto por “Montar banco” na Buscar questões e na mesa da Bonnie</span></figcaption>
        <div class="modal card study-popup">
          <div class="modal-head"><div class="modal-title">Montar banco de questões</div><button class="icon-btn" aria-label="Fechar">✕</button></div>
          <div class="modal-body">
            <p class="field-hint study-note">
              Escolha a disciplina. Para cada tópico da trilha, o app lê os livros dessa disciplina em “study sources” e escreve questões só com o que está neles.
            </p>
            <label class="field">
              <span class="field-label">Disciplina</span>
              <select class="input">
                <option>Todas as disciplinas (9 · 122 tópicos)</option>
                <option selected>Estrutura de Dados (14 tópicos)</option>
                <option>Metodologia Científica (sem livro local)</option>
              </select>
            </label>
            <div class="bk-row">
              <label class="field">
                <span class="field-label">Tópico (opcional)</span>
                <select class="input">
                  <option>Todos os tópicos da disciplina</option>
                  <option>Filas</option>
                </select>
              </label>
              <label class="field bk-narrow">
                <span class="field-label">Questões por tópico</span>
                <input class="input" type="number" value="20" min="1" max="50" />
              </label>
            </div>
            <div class="bk-estimate">
              <span><b>14</b> tópicos</span>
              <span><b>9</b> já têm 20 e serão pulados</span>
              <span>até <b>100</b> questões novas</span>
              <span>leva de 30 a 60 min</span>
            </div>
            <p class="bk-warn">As questões entram sem sua revisão; a cadeia de agentes confere cada uma.</p>
            <details class="bk-steps">
              <summary>Como cada questão é conferida</summary>
              <ol>
                <li><b>Autor</b> escreve pergunta, resposta, justificativa e copia a frase do livro que prova a resposta.</li>
                <li><b>Conferência da citação</b>: a frase precisa estar no trecho do livro.</li>
                <li><b>Semelhança</b>: recusa se for quase igual a outra do mesmo tópico.</li>
                <li><b>Resolvedor cego</b> responde sem ver a resposta do autor.</li>
                <li><b>Verificador</b> compara as duas respostas com o livro e só aprova se a pergunta tiver uma única resposta certa.</li>
              </ol>
              <p class="field-hint" style="margin: 0 14px 10px">Ninguém usa a internet. Se uma etapa recusa, o autor tenta de novo (até 3 vezes).</p>
            </details>
          </div>
          <div class="modal-foot study-modal-foot">
            <button class="btn">Cancelar</button>
            <button class="btn btn-primary">Montar banco</button>
          </div>
        </div>
      </figure>

      <!-- B -->
      <figure class="pv-fig pv-w-sm" id="b">
        <figcaption>B · Progresso<span>pode fechar: continua em segundo plano</span></figcaption>
        <div class="modal card study-popup">
          <div class="modal-head"><div class="modal-title">Montando o banco</div><button class="icon-btn" aria-label="Fechar">✕</button></div>
          <div class="modal-body">
            <div class="bk-now" role="status">
              <div class="bk-now-top">
                <span class="tk-sub">Tópico 6 de 14</span>
                <b>Filas</b>
                <span class="grow"></span>
                <span class="bk-frac">11/20</span>
              </div>
              <div class="bk-meter" data-n="11" data-goal="20"></div>
              <div class="bk-step-chips" aria-label="Questão 12, etapa atual">
                <span class="ok">✓ autor</span><span class="ok">✓ citação</span><span class="ok">✓ semelhança</span><span class="now">resolvedor cego…</span><span>verificador</span>
              </div>
              <span class="field-hint">Livro: Estruturas de Dados e Algoritmos em Java, p. 228–236</span>
            </div>
            <div class="qc-block">
              <span class="qc-label">Estrutura de Dados · 6 de 14 tópicos</span>
              <div class="bk-total-bar"><span style="width: 39%"></span></div>
            </div>
            <div class="bk-counts">
              <div class="bk-count acc"><b>58</b><span>questões adicionadas</span></div>
              <div class="bk-count"><b>3</b><span>tópicos pulados (já completos)</span></div>
              <div class="bk-count warn"><b>1</b><span>tópico com falta</span></div>
            </div>
            <ul class="bk-log" aria-label="Tópicos já feitos">
              <li class="ok"><b>20/20</b><span>Recursão</span></li>
              <li class="short"><b>7/20</b><span>Árvores B · o livro tem pouco material</span></li>
              <li class="ok"><b>20/20</b><span>Pilhas</span></li>
              <li class="skip"><b>pulado</b><span>Listas encadeadas · já tem 20</span></li>
              <li class="skip"><b>pulado</b><span>Vetores · já tem 20</span></li>
            </ul>
          </div>
          <div class="modal-foot study-modal-foot">
            <button class="btn btn-danger-ghost">Parar</button>
            <div class="grow"></div>
            <button class="btn btn-primary">Continuar em segundo plano</button>
          </div>
        </div>
        <span class="field-hint">Em segundo plano, um aviso fica no canto da tela; clicar reabre esta janela:</span>
        <div><span class="bk-hud"><span class="bk-dot"></span><b>Banco</b> Filas · 6/14 tópicos <small>58 novas</small></span></div>
        <span class="field-hint">“Parar” pergunta antes: “O que já entrou fica no banco. Você pode continuar depois de onde parou.”</span>
      </figure>

            <details class="bk-disc" open>

              <ul class="bk-topics">
                <li class="bk-topic zero">

                </li>
              </ul>
            </details>
            <details class="bk-disc" open>
              <summary><span class="bk-dname">Estrutura de Dados</span><span class="bk-meter bk-meter-sm short" data-n="17" data-goal="20"></span><span class="bk-frac short">238/280</span></summary>
              <ul class="bk-topics">
                <li class="bk-topic short">
                  <span class="bk-topic-name">Árvores B</span><span class="bk-meter bk-meter-sm short" data-n="7" data-goal="20"></span><span class="bk-frac short">7/20</span>
                  <span class="bk-why"><span class="bk-reason passage">Pouco material</span>O livro tem pouco sobre o tópico. <span class="grow"></span><button class="btn">Abrir na Biblioteca</button><button class="btn">Indicar outro livro…</button></span>
                </li>
                <li class="bk-topic zero">
                  <span class="bk-topic-name">Hashing perfeito</span><span class="bk-meter bk-meter-sm short" data-n="0" data-goal="20"></span><span class="bk-frac zero">0/20</span>
                  <span class="bk-why"><span class="bk-reason passage">Nenhum trecho</span>Nenhum trecho dos livros cita o tópico. <span class="grow"></span><button class="btn">Indicar livro…</button></span>
                </li>
                <li class="bk-topic short">
                  <span class="bk-topic-name">Filas de prioridade</span><span class="bk-meter bk-meter-sm short" data-n="14" data-goal="20"></span><span class="bk-frac short">14/20</span>
                  <span class="bk-why"><span class="bk-reason refused">Parecidas demais</span>As últimas questões saíram parecidas demais com as que já existem. <span class="grow"></span><button class="btn">Tentar de novo</button></span>
                </li>
                <li class="bk-topic short">
                  <span class="bk-topic-name">Grafos: busca em largura</span><span class="bk-meter bk-meter-sm short" data-n="16" data-goal="20"></span><span class="bk-frac short">16/20</span>
                  <span class="bk-why"><span class="bk-reason refused">Verificador recusou</span>O verificador recusou 4 questões: a resposta não estava clara no livro. <span class="grow"></span><button class="btn">Tentar de novo</button></span>
                </li>
                <li class="bk-topic done">
                  <span class="bk-topic-name">Listas encadeadas</span><span class="bk-meter bk-meter-sm done" data-n="20" data-goal="20"></span><span class="bk-frac done">20/20</span>
                  <span class="bk-why"><span class="bk-reason has">Já tem questões</span>Já tinha 20; não foi mexido.</span>
                </li>
                <li class="bk-topic done"><span class="bk-topic-name">Pilhas</span><span class="bk-meter bk-meter-sm done" data-n="20" data-goal="20"></span><span class="bk-frac done">20/20</span></li>
              </ul>
            </details>
            <details class="bk-disc">
              <summary><span class="bk-dname">Lógica e Matemática Discreta</span><span class="bk-meter bk-meter-sm done" data-n="20" data-goal="20"></span><span class="bk-frac done">300/300</span></summary>
            </details>
          </div>
          <div class="modal-foot study-modal-foot">
            <button class="btn">Tentar de novo os tópicos com falta (24)</button>
            <div class="grow"></div>
            <button class="btn btn-primary">Ver o banco</button>
          </div>
        </div>
      </figure>

      <!-- D -->

      <!-- E -->
      <figure class="pv-fig" id="e" style="width: 600px">
        <figcaption>E · Cartão de questão<span>dois selos que não se confundem</span></figcaption>
        <div class="qc-legend">
          <div><span class="seal seal-agents"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="10" height="8"/><path d="M8 2v3M6 9h0M10 9h0"/></svg>Verificada por agentes</span>azul, borda tracejada, ícone de robô: conferida pela cadeia, ninguém leu</div>
          <div><span class="seal seal-you"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8l3 3 7-7"/></svg>Revisada por você</span>verde cheio, ícone de visto, com a data: você leu e aprovou</div>
        </div>
        <article class="qc">
          <div class="qc-top">
            <span class="seal seal-agents"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="10" height="8"/><path d="M8 2v3M6 9h0M10 9h0"/></svg>Verificada por agentes</span>
            <span class="qc-topic">Estrutura de Dados · Filas · Livro</span>
          </div>
          <p class="qc-q">Em uma fila implementada com vetor circular, o que acontece com o índice de fim quando ele chega à última posição do vetor e ainda há espaço livre no início?</p>
          <details class="qc-block">
            <summary class="qc-label" style="cursor: pointer">Ver resposta</summary>
            <p><b>Resposta:</b> ele volta para a posição 0, reaproveitando as posições liberadas.</p>
            <p><b>Justificativa:</b> no vetor circular o avanço do índice é feito módulo o tamanho do vetor, então após a última posição vem a primeira.</p>
          </details>
          <div class="qc-block">
            <span class="qc-label">Trecho do livro</span>
            <blockquote class="qc-quote">“Quando o índice de fim atinge o final do arranjo, ele recomeça do início, ocupando as posições liberadas pelas remoções.”</blockquote>
            <span class="qc-ref"><b>Estruturas de Dados e Algoritmos em Java</b> · p. 231 · conferida por autor, resolvedor cego e verificador</span>
          </div>
        </article>
        <article class="qc qc-you">
          <div class="qc-top">
            <span class="seal seal-you"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8l3 3 7-7"/></svg>Revisada por você · 12/10/2026</span>
            <span class="qc-topic">Lógica · Tabelas-verdade · ENEM 2019</span>
          </div>
          <p class="qc-q">Qual o valor lógico de (p → q) quando p é verdadeira e q é falsa?</p>
          <details class="qc-block"><summary class="qc-label" style="cursor: pointer">Ver resposta</summary><p>Falso.</p></details>
          <span class="qc-ref"><b>ENEM 2019</b> · caderno azul, questão 142 · enem.inep.gov.br</span>
        </article>
      </figure>

      <!-- F -->
      <figure class="pv-fig pv-w-md" id="f">
        <figcaption>F · Vazio e erros<span>cada um dentro da janela onde acontece</span></figcaption>
        <div class="modal card study-popup">
          <div class="modal-head"><div class="modal-title">Estados</div><button class="icon-btn" aria-label="Fechar">✕</button></div>
          <div class="modal-body">
            <div class="st">
              <div class="st-icon">?</div>
              <div class="st-body">
                <b>O banco está vazio</b>
                <p>Monte o banco pela trilha: o app escreve questões a partir dos seus livros e confere cada uma antes de guardar.</p>
                <div class="st-actions"><button class="btn btn-primary">Montar banco…</button></div>
              </div>
            </div>
            <div class="st warn">
              <div class="st-icon">‖</div>
              <div class="st-body">
                <b>A montagem parou em Filas (tópico 6 de 14)</b>
                <p>O app foi fechado no meio. As 58 questões feitas até ali já estão no banco. Continuar começa em Filas e pula o que está completo.</p>
                <div class="st-actions"><button class="btn btn-primary">Continuar de onde parou</button><button class="btn">Descartar</button></div>
              </div>
            </div>
            <div class="st err">
              <div class="st-icon">!</div>
              <div class="st-body">
                <b>O Claude não está respondendo</b>
                <p>Não deu para falar com o Claude (sem internet, sem login ou limite de uso). A montagem está pausada em Filas; nada se perdeu.</p>
                <div class="st-actions"><button class="btn btn-primary">Tentar de novo</button><button class="btn">Continuar mais tarde</button></div>
              </div>
            </div>
            <div class="st warn">
              <div class="st-icon">▦</div>
              <div class="st-body">
                <b>O banco está cheio: 1.000 de 1.000 questões</b>
                <p>Parei em Grafos sem gravar mais nada. Para abrir espaço, apague questões no Obsidian (arquivo “banco de questões.md”) ou monte uma disciplina por vez.</p>
                <div class="st-actions"><button class="btn">Abrir no Obsidian</button></div>
              </div>
            </div>
            <div class="st err">
              <div class="st-icon">≠</div>
              <div class="st-body">
                <b>O banco mudou no Obsidian enquanto eu gravava</b>
                <p>Sua edição foi mantida. As 6 questões de Pilhas não entraram, para não sobrescrever nada.</p>
                <div class="st-actions"><button class="btn btn-primary">Gravar Pilhas de novo</button></div>
              </div>
            </div>
          </div>
        </div>
      </figure>
    </main>
    <script>
      for (const meter of document.querySelectorAll('.bk-meter[data-goal]')) {
        const goal = Number(meter.dataset.goal)
        const n = Number(meter.dataset.n)
        meter.style.gridTemplateColumns = `repeat(${goal}, 1fr)`
        meter.setAttribute('role', 'img')
        meter.setAttribute('aria-label', `${n} de ${goal}`)
        for (let i = 0; i < goal; i++) meter.append(Object.assign(document.createElement('i'), { className: i < n ? 'on' : '' }))
      }
    </script>
  </body>
</html>
